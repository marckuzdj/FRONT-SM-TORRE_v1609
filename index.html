<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle Híbrido | Diagnóstico UF (White Mode)</title>
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    /* 🌟 WHITE MODE PREMIUM THEME (MINIMALISTA, CLEAN & ACESSÍVEL) */
    :root {
      --bg-global: #F4F4F6;
      --bg-card: #FFFFFF;
      --purple-neon: #8A05BE;
      --purple-dim: #EED6FF;
      --text-main: #1C1C1E;
      --text-muted: #6E6E73;
      --border-card: rgba(138, 5, 190, 0.08);
      --shadow-clean: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      --status-green: #00C853;
      --status-yellow: #FFD600;
      --status-red: #FF1744;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-global);
      color: var(--text-main);
      padding: 2rem;
      overflow-x: hidden;
    }

    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #000000;
    }

    h1 span {
      color: var(--purple-neon);
    }

    .btn-global {
      background: var(--purple-neon);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(138, 5, 190, 0.2);
    }

    .btn-global:hover {
      background: #70029E;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(138, 5, 190, 0.3);
    }

    /* 📊 KPI ROW METRICS */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow-clean);
    }

    .kpi-card p {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .kpi-card h2 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #000000;
    }

    /* 🗂️ GRID DE ESTADOS */
    .uf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .uf-card {
      background: var(--bg-card);
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow-clean);
      transition: all 0.2s ease;
    }

    .uf-card:hover {
      border: 1px solid var(--purple-neon);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .uf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .uf-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #000000;
    }

    .badge-status {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .bg-green { background-color: var(--status-green); box-shadow: 0 0 8px rgba(0, 200, 83, 0.4); }
    .bg-yellow { background-color: var(--status-yellow); box-shadow: 0 0 8px rgba(255, 214, 0, 0.4); }
    .bg-red { background-color: var(--status-red); box-shadow: 0 0 8px rgba(255, 23, 68, 0.4); }

    .sheet-link {
      display: flex;
      align-items: center;
      font-size: 0.85rem;
      color: var(--purple-neon);
      margin-bottom: 0.75rem;
      text-decoration: none;
      font-weight: 500;
    }

    .sheet-link:hover {
      text-decoration: underline;
    }

    .diagnostic-box {
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      margin-top: 1rem;
      padding-top: 1rem;
      font-size: 0.9rem;
    }

    .diagnostic-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .diagnostic-item span:first-child {
      color: var(--text-muted);
    }

    .diagnostic-item span:last-child {
      font-weight: 600;
      color: #000000;
    }

    .action-row-card {
      margin-top: 1.25rem;
      display: flex;
      justify-content: flex-end;
    }

    .btn-action-sm {
      background: var(--purple-dim);
      border: none;
      color: var(--purple-neon);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action-sm:hover {
      background: var(--purple-neon);
      color: white;
    }
  </style>
</head>

<body>

  <div class="dashboard-container">
    <header>
      <h1><span>SmartCargas</span> - ECOSYSTEM DIAGNOSTIC PANEL</h1>
      <button class="btn-global" onclick="carregarDadosGlobais()">Atualizar Ecossistema</button>
    </header>

    <!-- KPI ROW METRICS (CÁLCULO DINÂMICO REAL) -->
    <div class="kpi-row">
      <div class="kpi-card">
        <p>Total de Planilhas</p>
        <h2 id="kpi-total-sheets">54</h2>
      </div>
      <div class="kpi-card">
        <p>Abas Órfãs Locais</p>
        <h2 id="kpi-total-resgatadas" style="color: var(--purple-neon);">0</h2>
      </div>
      <div class="kpi-card">
        <p>Faltantes na Master</p>
        <h2 id="kpi-total-faltantes" style="color: #F57C00;">0</h2>
      </div>
      <div class="kpi-card">
        <p>Alertas Críticos</p>
        <h2 id="kpi-total-criticos" style="color: var(--status-red);">0</h2>
      </div>
    </div>

    <!-- UF STATES GRID DISPLAY -->
    <div class="uf-grid" id="grid-estados-uf">
      <!-- Injeção assíncrona JS ocorrerá aqui -->
    </div>
  </div>

  <script>
    // 🌟 LINK WEB APP: Certifique-se de usar a URL de publicação da sua planilha de controle
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxhN3DYLc17sloBp5EXFzEdGFe0lGfV_Gz2bpiRH5R2OkBLL1hr8aYhIx5Jus-fnSyt/exec";

    function carregarDadosGlobais() {
      const grid = document.getElementById("grid-estados-uf");
      grid.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem; font-weight: 500;'>📡 Conectando e consolidando a malha de estados em RAM...</div>";

      fetch(WEB_APP_URL + "?action=obterDiagnosticoGlobal")
        .then(response => response.json())
        .then(dados => {
          if(!dados.success) {
            grid.innerHTML = `<div style='grid-column: 1/-1; text-align: center; color: var(--status-red); padding: 3rem; font-weight: 600;'>Erro no Servidor: ${dados.error}</div>`;
            return;
          }
          renderizarCards(dados.data);
          calcularKPIsDinâmicos(dados.data);
        })
        .catch(err => {
          grid.innerHTML = `<div style='grid-column: 1/-1; text-align: center; color: var(--status-red); padding: 3rem; font-weight: 600;'>Erro na conexão API: ${err}</div>`;
        });
    }

    // 🌟 FUNÇÃO DE FORMATAÇÃO DE DATA E HORA [dd/MM/yyyy HH:mm:ss]
    function formatarDataBR(dataString) {
      if (!dataString || dataString === "Sem registro" || dataString === "ERRO DE CONEXÃO") {
        return dataString;
      }
      
      try {
        // Tenta converter o texto bruto recebido em um objeto Date do JS
        const dataObj = new Date(dataString);
        
        // Se a conversão falhar (NaN), retorna o texto original recebido como fallback seguro
        if (isNaN(dataObj.getTime())) {
          return dataString;
        }

        const dia = String(dataObj.getDate()).padStart(2, '0');
        const mes = String(dataObj.getMonth() + 1).padStart(2, '0'); // Meses começam em 0 no JS
        const ano = dataObj.getFullYear();
        
        const hora = String(dataObj.getHours()).padStart(2, '0');
        const minuto = String(dataObj.getMinutes()).padStart(2, '0');
        const segundo = String(dataObj.getSeconds()).padStart(2, '0');

        return `${dia}/${mes}/${ano} ${hora}:${minuto}:${segundo}`;
      } catch (e) {
        return dataString; // Fallback se houver erro interno de string
      }
    }

    function renderizarCards(listaUfs) {
      const grid = document.getElementById("grid-estados-uf");
      grid.innerHTML = "";

      if(listaUfs.length === 0) {
        grid.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;'>Nenhum estado localizado na aba METRICAS_UF.</div>";
        return;
      }

      listaUfs.forEach(uf => {
        const corClasse = uf.criticos > 0 ? 'bg-red' : (uf.orfas > 0 || uf.faltantes > 0 ? 'bg-yellow' : 'bg-green');
        
        // 🎯 INJEÇÃO DO FORMATADOR: Trata a string temporal de atualização antes de exibir no card
        const dataFormatadaPronta = formatarDataBR(uf.atualizado_em);

        const cardHtml = `
          <div class="uf-card">
            <div class="uf-header">
              <div class="uf-title">${uf.nome_estado} (${uf.sigla})</div>
              <span class="badge-status ${corClasse}"></span>
            </div>
            <a href="https://google.com{uf.id_planilha_prod}" target="_blank" class="sheet-link">🔗 Planilha Produção</a>
            
            <div class="diagnostic-box">
              <div class="diagnostic-item">
                <span>Abas Ativas:</span>
                <span>${uf.abas_existentes}</span>
              </div>
              <div class="diagnostic-item">
                <span>Abas Órfãs Locais:</span>
                <span style="${uf.orfas > 0 ? 'color: #D32F2F; font-weight: 700;' : ''}">${uf.orfas}</span>
              </div>
              <div class="diagnostic-item">
                <span>Faltantes Master:</span>
                <span style="${uf.faltantes > 0 ? 'color: #E65100; font-weight: 700;' : ''}">${uf.faltantes}</span>
              </div>
              <div class="diagnostic-item" style="border-top: 1px dashed #E5E5EA; margin-top: 0.5rem; padding-top: 0.5rem; font-size: 0.75rem;">
                <span>Atualizado em:</span>
                <span style="font-weight: 500; color: var(--text-muted);">${dataFormatadaPronta}</span>
              </div>
            </div>
            
            <div class="action-row-card">
              <button class="btn-action-sm" onclick="forcarResgateLocal('${uf.sigla}', '${uf.id_planilha_prod}')">Resgatar Órfãs</button>
            </div>
          </div>
        `;
        grid.innerHTML += cardHtml;
      });
    }

    function calcularKPIsDinâmicos(listaUfs) {
      let somaOrfas = 0;
      let somaFaltantes = 0;
      let somaCriticos = 0;

      listaUfs.forEach(uf => {
        somaOrfas += parseInt(uf.orfas) || 0;
        somaFaltantes += parseInt(uf.faltantes) || 0;
        somaCriticos += parseInt(uf.criticos) || 0;
      });

      document.getElementById("kpi-total-sheets").innerText = listaUfs.length;
      document.getElementById("kpi-total-resgatadas").innerText = somaOrfas;
      document.getElementById("kpi-total-faltantes").innerText = somaFaltantes;
      document.getElementById("kpi-total-criticos").innerText = somaCriticos;
    }

    function forcarResgateLocal(sigla, idPlanilha) {
      if(confirm(`⚠️ Deseja disparar a contingência sênior em lote para resgatar bipes órfãos de ${sigla} agora?`)) {
        fetch(`${WEB_APP_URL}?action=forcarResgateUf&id_planilha=${idPlanilha}`)
          .then(response => response.json())
          .then(res => {
            alert(res.message || "Comando enviado!");
            carregarDadosGlobais(); 
          })
          .catch(err => alert("Erro ao despachar comando: " + err));
      }
    }

    window.onload = carregarDadosGlobais;
  </script>
</body>
</html>
