<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle Híbrido | Diagnóstico UF (White Mode)</title>
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    /* 🌟 WHITE MODE PREMIUM THEME */
    :root {
      --bg-global: #F4F4F6;
      --bg-card: #FFFFFF;
      --purple-neon: #8A05BE;
      --purple-dim: #EED6FF;
      --text-main: #1C1C1E;
      --text-muted: #6E6E73;
      --border-card: rgba(138, 5, 190, 0.08);
      --shadow-clean: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      --status-green: #00C853;
      --status-yellow: #FFD600;
      --status-red: #FF1744;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-global);
      color: var(--text-main);
      padding: 2rem;
      overflow-x: hidden;
    }

    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #000000;
    }

    h1 span {
      color: var(--purple-neon);
    }

    .btn-global {
      background: var(--purple-neon);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(138, 5, 190, 0.2);
    }

    .btn-global:hover {
      background: #70029E;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(138, 5, 190, 0.3);
    }

    /* 📊 KPI ROW METRICS */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow-clean);
    }

    .kpi-card p {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .kpi-card h2 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #000000;
    }

    /* 🗂️ GRID DE ESTADOS */
    .uf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .uf-card {
      background: var(--bg-card);
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow-clean);
      transition: all 0.2s ease;
    }

    .uf-card:hover {
      border: 1px solid var(--purple-neon);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .uf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .uf-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #000000;
    }

    .badge-status {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .bg-green { background-color: var(--status-green); box-shadow: 0 0 8px rgba(0, 200, 83, 0.4); }
    .bg-yellow { background-color: var(--status-yellow); box-shadow: 0 0 8px rgba(255, 214, 0, 0.4); }
    .bg-red { background-color: var(--status-red); box-shadow: 0 0 8px rgba(255, 23, 68, 0.4); }

    .sheet-link {
      display: flex;
      align-items: center;
      font-size: 0.85rem;
      color: var(--purple-neon);
      margin-bottom: 0.75rem;
      text-decoration: none;
      font-weight: 500;
    }

    .sheet-link:hover {
      text-decoration: underline;
    }

    .diagnostic-box {
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      margin-top: 1rem;
      padding-top: 1rem;
      font-size: 0.9rem;
    }

    .diagnostic-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .diagnostic-item span:first-child {
      color: var(--text-muted);
    }

    .diagnostic-item span:last-child {
      font-weight: 600;
      color: #000000;
    }

    .action-row-card {
      margin-top: 1.25rem;
      display: flex;
      justify-content: flex-end;
    }

    .btn-action-sm {
      background: var(--purple-dim);
      border: none;
      color: var(--purple-neon);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action-sm:hover {
      background: var(--purple-neon);
      color: white;
    }

    /* 🚨 MODAL PROGRESSO & LOGS */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .modal-box {
      background: #FFFFFF;
      width: 600px;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    
    .modal-box h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #000000;
    }
    
    .progress-wrapper {
      background: #E5E5EA;
      width: 100%;
      height: 8px;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    
    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--purple-neon);
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    
    .terminal-box {
      background: #1C1C1E;
      border-radius: 8px;
      padding: 1rem;
      height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem;
      color: #00E676;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .terminal-box .log-err { color: #FF1744; }
    .terminal-box .log-info { color: #FFD600; }

    .filter-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .btn-filter {
      background: #E5E5EA;
      color: var(--text-main);
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-filter:hover {
      background: var(--purple-dim);
      color: var(--purple-neon);
    }

    .btn-filter.active {
      background: var(--purple-neon);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(138, 5, 190, 0.2);
    }


    
  </style>
</head>

  <body>

  <div class="dashboard-container">
    <header>
      <h1><span>SmartCargas</span>-ECOSYSTEM DIAGNOSTIC PANEL</h1>
      <button class="btn-global" onclick="carregarDadosGlobais()">Atualizar Ecossistema</button>
    </header>

    <!-- 🌟 INJEÇÃO DA BARRA DE FILTROS REGIONAIS BRASILEIRAS -->
    <div class="filter-row">
      <button class="btn-filter active" onclick="filtrarRegiao('TODOS', this)">Todos</button>
      <button class="btn-filter" onclick="filtrarRegiao('SUDESTE', this)">Sudeste</button>
      <button class="btn-filter" onclick="filtrarRegiao('SUL', this)">Sul</button>
      <button class="btn-filter" onclick="filtrarRegiao('NORDESTE', this)">Nordeste</button>
      <button class="btn-filter" onclick="filtrarRegiao('CENTRO-OESTE', this)">Centro-Oeste</button>
      <button class="btn-filter" onclick="filtrarRegiao('NORTE', this)">Norte</button>
    </div>

    
    <!-- KPI ROW METRICS -->
    <div class="kpi-row">
      <div class="kpi-card">
        <p>Total de Planilhas</p>
        <h2 id="kpi-total-sheets">54</h2>
      </div>
      <div class="kpi-card">
        <p>Abas Órfãs Locais</p>
        <h2 id="kpi-total-resgatadas" style="color: var(--purple-neon);">0</h2>
      </div>
      <div class="kpi-card">
        <p>Faltantes na Master</p>
        <h2 id="kpi-total-faltantes" style="color: #F57C00;">0</h2>
      </div>
      <div class="kpi-card">
        <p>Alertas Críticos</p>
        <h2 id="kpi-total-criticos" style="color: var(--status-red);">0</h2>
      </div>
    </div>

    <!-- UF STATES GRID DISPLAY -->
    <div class="uf-grid" id="grid-estados-uf"></div>
  </div>

  <!-- CONTAINER DO MODAL DIALÓGICO DE RESGATE -->
  <!-- 🎯 SUBSTITUA APENAS O RODAPÉ DE BOTÃO DENTRO DA SUA DIV modal-box -->
  <div class="modal-overlay" id="modal-resgate">
    <div class="modal-box">
      <h3 id="modal-titulo">Processando Operação...</h3>
      <div class="progress-wrapper">
        <div class="progress-bar" id="barra-progresso"></div>
      </div>
      <div class="terminal-box" id="terminal-logs"></div>
      
      <!-- 🌟 O NOVO BOTÃO FIXO "FECHAR" COM CLIQUE DIRETO VIA JAVASCRIPT -->
      <div style="display: flex; justify-content: flex-end;">
        <button class="btn-global" id="btn-fechar-modal" onclick="document.getElementById('modal-resgate').style.display='none'">FECHAR</button>
      </div>
    </div>
  </div>

    
  <script>

    // =========================================================================
    // 💾 CACHE DO ECOSSISTEMA & DICIONÁRIO GEOGRÁFICO (ESCOPO GLOBAL RAM)
    // =========================================================================
    // Armazena temporariamente os dados retornados da API para fatiamento sem travar a rede
    let cacheDadosEcosistema = [];

    // Mapeamento geográfico oficial dos estados brasileiros por sigla UF
    const MAPA_REGIOES_BR = {
      'SP': 'SUDESTE', 'RJ': 'SUDESTE', 'MG': 'SUDESTE', 'ES': 'SUDESTE',
      'PR': 'SUL', 'SC': 'SUL', 'RS': 'SUL',
      'BA': 'NORDESTE', 'PE': 'NORDESTE', 'CE': 'NORDESTE', 'MA': 'NORDESTE', 
      'PB': 'NORDESTE', 'RN': 'NORDESTE', 'AL': 'NORDESTE', 'SE': 'NORDESTE', 
      'PI': 'NORDESTE',
      'MT': 'CENTRO-OESTE', 'MS': 'CENTRO-OESTE', 'GO': 'CENTRO-OESTE', 
      'DF': 'CENTRO-OESTE',
      'AM': 'NORTE', 'PA': 'NORTE', 'RO': 'NORTE', 'RR': 'NORTE', 
      'AC': 'NORTE', 'TO': 'NORTE', 'AP': 'NORTE'
    };
    // =========================================================================

    
    // 🌟 LINK WEB APP CENTRALIZADO: Substitua pela URL gerada no deploy do seu Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxhN3DYLc17sloBp5EXFzEdGFe0lGfV_Gz2bpiRH5R2OkBLL1hr8aYhIx5Jus-fnSyt/exec";


    function carregarDadosGlobais() {
      const grid = document.getElementById("grid-estados-uf");
      const modal = document.getElementById("modal-resgate");
      const barra = document.getElementById("barra-progresso");
      const terminal = document.getElementById("terminal-logs");
      
      document.getElementById("modal-titulo").innerText = "Auditoria Global do Ecossistema (54 UFs)";
      modal.style.display = "flex";
      barra.style.width = "15%";
      barra.style.background = "var(--purple-neon)";
      
      terminal.innerHTML = `[${new Date().toLocaleTimeString()}] 📡 Iniciando requisição de diagnóstico em RAM...<br>`;
      grid.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem; font-weight: 500;'>📡 Conectando e consolidando a malha de estados em RAM...</div>";

      fetch(WEB_APP_URL + "?action=obterDiagnosticoGlobal")
        .then(response => response.json())
        .then(dados => {
          if(!dados.success) {
            barra.style.width = "100%"; barra.style.background = "var(--status-red)";
            terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-err">[ERRO]</span> Falha do Servidor: ${dados.error}<br>`;
            grid.innerHTML = `<div style='grid-column: 1/-1; text-align: center; color: var(--status-red); padding: 3rem; font-weight: 600;'>Erro no Servidor: ${dados.error}</div>`;
            return;
          }
          
          // 📥 Aloca o array retornado no cache global da RAM do navegador
          cacheDadosEcosistema = dados.data;
          
          // 🎯 ENCONTRE ESTE TRECHO DENTRO DE carregarDadosGlobais():
          barra.style.width = "100%";
          barra.style.background = "var(--status-green)";
          terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color: #00E676;">[SUCESSO]</span> Dados estruturais consolidados em RAM.<br>`;
          
          resetarBotoesFiltro();
          renderizarCards(cacheDadosEcosistema);
          
          // 🎯 INJEÇÃO CIRÚRGICA: Corrigido o nome exato da função (i minúsculo)
          calcularKPIDinamicos(cacheDadosEcosistema);
          
          setTimeout(() => { modal.style.display = "none"; }, 1000);

        })
        .catch(err => {
          barra.style.width = "100%"; barra.style.background = "var(--status-red)";
          terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-err">[CRÍTICO]</span> Falha de rede: ${err}<br>`;
        });
    }

    // 🚀 ENGINE DE FILTRAGEM RELÂMPAGO
    function filtrarRegiao(regiaoAlvo, botaoClicado) {
      // Altera o estado visual dos botões de filtro
      document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
      botaoClicado.classList.add('active');

      if (regiaoAlvo === 'TODOS') {
        renderizarCards(cacheDadosEcosistema);
        return;
      }

      // Filtra as UFs na memória RAM baseando-se no dicionário geográfico
      const listaFiltrada = cacheDadosEcosistema.filter(uf => {
        const regiaoUf = MAPA_REGIOES_BR[uf.sigla.toUpperCase()] || 'OUTROS';
        return regiaoUf === regiaoAlvo;
      });

      renderizarCards(listaFiltrada);
    }

    function resetarBotoesFiltro() {
      document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
      const btnTodos = document.querySelector(".filter-row button");
      if (btnTodos) btnTodos.classList.add('active');
    }

    // Ajuste da carga inicial reativa síncrona conectada ao cache
    // 🎯 REATIVO, BLINDADO E COM LOGS VISUAIS EM TEMPO REAL NA CARGA INICIAL
    window.onload = function() {
      const modal = document.getElementById("modal-resgate");
      const barra = document.getElementById("barra-progresso");
      const terminal = document.getElementById("terminal-logs");
      const btnFechar = document.getElementById("btn-fechar-modal");
      
      // Abre o modal no modo de sincronismo inicial
      document.getElementById("modal-titulo").innerText = "Sincronizando Sistema Central";
      modal.style.display = "flex";
      barra.style.width = "20%";
      barra.style.background = "var(--purple-neon)";
      
      terminal.innerHTML = `[${new Date().toLocaleTimeString()}] 📡 Conectando na malha de servidores...<br>`;

      let sistemaEstabilizadoComSucesso = false;

      function dispararAuditoriaFrenetica() {
        if (sistemaEstabilizadoComSucesso) return;

        fetch(WEB_APP_URL + "?action=obterDiagnosticoGlobal")
          .then(res => res.json())
          .then(dados => {
            if (dados.success) {
              
              // 🔍 CASO 1: O BACKEND INFORMA QUE O AUTO-GATILHO ESTÁ POPULANDO AS COLUNAS VAZIAS
              if (dados.initializing) {
                barra.style.width = "65%";
                barra.style.background = "var(--purple-neon)";
                // 🌟 INJEÇÃO DE LOG ATIVA: Alerta o usuário do progresso real na tela!
                terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-info">[PROCESSANDO]</span> Colunas vazias detectadas. Robô de emergência ativo atualizando as 54 UFs no Drive...<br>`;
                terminal.scrollTop = terminal.scrollHeight; // Auto-scroll do terminal
                
                // Tenta ler novamente em 5 segundos até o robô terminar
                setTimeout(dispararAuditoriaFrenetica, 5000);
                return;
              }

              // 🎯 CASO 2: SINAL VERDE! OS DADOS JÁ OPERAM NA PLANILHA OU O ROBÔ ACABOU DE SALVAR
              sistemaEstabilizadoComSucesso = true; 
              barra.style.width = "100%";
              barra.style.background = "var(--status-green)";
              terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color: #00E676;">[SUCESSO]</span> Ecossistema carregado com precisão.<br>`;
              terminal.innerHTML += `[${new Date().toLocaleTimeString()}] 🏁 Painel liberado com sucesso.`;
              terminal.scrollTop = terminal.scrollHeight;
              
              // Carrega a malha global RAM e renderiza os cards
              cacheDadosEcosistema = dados.data;
              renderizarCards(dados.data);
              calcularKPIDinamicos(dados.data);
              
              // Oculta o modal automaticamente após o sucesso para liberar o dashboard claro
              setTimeout(() => { 
                modal.style.display = "none"; 
              }, 1200);

            } else {
              barra.style.width = "100%"; 
              barra.style.background = "var(--status-red)";
              terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-err">[ERRO]</span> Servidor recusou: ${dados.error}<br>`;
            }
          })
          .catch(err => {
            if (sistemaEstabilizadoComSucesso) return;

            // CASO O GOOGLE DÊ TIMEOUT NA PRIMEIRA REQUISIÇÃO ENQUANTO O ROBÔ ESTÁ SALVANDO NAS CÉLULAS
            barra.style.width = "45%";
            barra.style.background = "var(--purple-neon)";
            terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-info">[INFO]</span> Gravando lote de metadados no Drive. Aguardando persistência celular (Polling Ativo)...<br>`;
            terminal.scrollTop = terminal.scrollHeight;
            
            // Continua tentando ler a API a cada 6 segundos de forma resiliente
            setTimeout(dispararAuditoriaFrenetica, 6000);
          });
      }

      // Dispara a esteira automática de carregamento
      dispararAuditoriaFrenetica();
    };



    // 🎯 FORMATADOR DE DATA PREMIUM BRASILEIRO (dd/MM/yyyy HH:mm:ss)
    function formatarDataBR(dataString) {
      if (!dataString || dataString === "Sem registro" || dataString === "ERRO DE CONEXÃO") return dataString;
      try {
        const dataObj = new Date(dataString);
        if (isNaN(dataObj.getTime())) return dataString;
        const dia = String(dataObj.getDate()).padStart(2, '0');
        const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
        const ano = dataObj.getFullYear();
        const hora = String(dataObj.getHours()).padStart(2, '0');
        const minuto = String(dataObj.getMinutes()).padStart(2, '0');
        const segundo = String(dataObj.getSeconds()).padStart(2, '0');
        return `${dia}/${mes}/${ano} ${hora}:${minuto}:${segundo}`;
      } catch (e) { return dataString; }
    }

    function renderizarCards(listaUfs) {
      const grid = document.getElementById("grid-estados-uf");
      grid.innerHTML = "";
      
      listaUfs.forEach(uf => {
        const corClasse = uf.criticos > 0 ? 'bg-red' : (uf.orfas > 0 || uf.faltantes > 0 ? 'bg-yellow' : 'bg-green');
        const dataFormatadaPronta = formatarDataBR(uf.atualizado_em);

        const cardHtml = `
          <div class="uf-card">
            <div class="uf-header">
              <div class="uf-title">${uf.nome_estado} (${uf.sigla})</div>
              <span class="badge-status ${corClasse}"></span>
            </div>
            <a href="https://google.com{uf.id_planilha_prod}" target="_blank" class="sheet-link">🔗 Planilha Produção</a>
            <div class="diagnostic-box">
              <div class="diagnostic-item"><span>Abas Ativas:</span><span>${uf.abas_existentes}</span></div>
              <div class="diagnostic-item"><span>Abas Órfãs Locais:</span><span style="${uf.orfas > 0 ? 'color: #D32F2F; font-weight: 700;' : ''}">${uf.orfas}</span></div>
              <div class="diagnostic-item"><span>Faltantes Master:</span><span style="${uf.faltantes > 0 ? 'color: #E65100; font-weight: 700;' : ''}">${uf.faltantes}</span></div>
              <div class="diagnostic-item" style="border-top: 1px dashed #E5E5EA; margin-top: 0.5rem; padding-top: 0.5rem; font-size: 0.75rem;">
                <span>Atualizado em:</span><span style="font-weight: 500; color: var(--text-muted);">${dataFormatadaPronta}</span>
              </div>
            </div>
            <div class="action-row-card">
              <button class="btn-action-sm" onclick="forcarResgateLocal('${uf.sigla}', '${uf.id_planilha_prod}')">Resgatar Órfãs</button>
            </div>
          </div>
        `;
        grid.innerHTML += cardHtml;
      });
    }

    function calcularKPIsDinâmicos(listaUfs) {
      let somaOrfas = 0; let somaFaltantes = 0; let somaCriticos = 0;
      listaUfs.forEach(uf => {
        somaOrfas += parseInt(uf.orfas) || 0;
        somaFaltantes += parseInt(uf.faltantes) || 0;
        somaCriticos += parseInt(uf.criticos) || 0;
      });
      document.getElementById("kpi-total-sheets").innerText = listaUfs.length;
      document.getElementById("kpi-total-resgatadas").innerText = somaOrfas;
      document.getElementById("kpi-total-faltantes").innerText = somaFaltantes;
      document.getElementById("kpi-total-criticos").innerText = somaCriticos;
    }

    function forcarResgateLocal(sigla, idPlanilha) {
      if (confirm(`⚠️ ATENÇÃO: Deseja disparar a contingência sênior em lote para resgatar bipes órfãos de ${sigla} agora?\n\nIsso injetará os bipes na Master DETALHADO e excluirá as abas locais residuais.`)) {
        
        const modal = document.getElementById("modal-resgate");
        const barra = document.getElementById("barra-progresso");
        const terminal = document.getElementById("terminal-logs");
        
        document.getElementById("modal-titulo").innerText = `Operação de Contingência: ${sigla}`;
        modal.style.display = "flex";
        barra.style.width = "10%";
        barra.style.background = "var(--purple-neon)";
        
        terminal.innerHTML = `[${new Date().toLocaleTimeString()}] 📡 Estabelecendo canal com a Planilha de Controle...<br>`;
        
        setTimeout(() => {
          barra.style.width = "35%";
          terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-info">[INFO]</span> Abrindo arquivo regional via ID do Drive...<br>`;
          terminal.scrollTop = terminal.scrollHeight;
        }, 600);

        setTimeout(() => {
          barra.style.width = "60%";
          terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-info">[INFO]</span> Invocando função real executarResgateEExpurgoAbasOrfas...<br>`;
          terminal.scrollTop = terminal.scrollHeight;
          
          fetch(`${WEB_APP_URL}?action=forcarResgateUf&id_planilha=${idPlanilha}`)
            .then(response => response.json())
            .then(res => {
              if (res.success) {
                barra.style.width = "100%";
                barra.style.background = "var(--status-green)";
                terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color: #00E676;">[SUCESSO]</span> ${res.message}<br>`;
                terminal.innerHTML += `[${new Date().toLocaleTimeString()}] 🏁 Sincronização concluída. Painel local atualizado em lote.`;
                terminal.scrollTop = terminal.scrollHeight;

                // 🚀 ATUALIZAÇÃO EM BACKGROUND SILENCIOSA (SEM CONCORRÊNCIA DE MODAL!)
                // Puxa o espelho do banco atualizado sem reabrir a caixa de logs por cima
                fetch(WEB_APP_URL + "?action=obterDiagnosticoGlobal")
                  .then(r => r.json())
                  .then(dados => {
                    if (dados.success) {
                      cacheDadosEcosistema = dados.data; // Atualiza o cache global da RAM
                      renderizarCards(dados.data);       // Redesenha os cards com o estado zerado
                      calcularKPIDinamicos(dados.data);  // Recalcula as caixas de somas do topo
                    }
                  });

              } else {
                barra.style.width = "100%";
                barra.style.background = "var(--status-red)";
                terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-err">[ERRO]</span> ${res.error}<br>`;
                terminal.scrollTop = terminal.scrollHeight;
              }
            })
            .catch(err => {
              barra.style.width = "100%";
              barra.style.background = "var(--status-red)";
              terminal.innerHTML += `[${new Date().toLocaleTimeString()}] <span class="log-err">[CRÍTICO]</span> Falha crítica na rede API: ${err}<br>`;
              terminal.scrollTop = terminal.scrollHeight;
            });
        }, 1400);
      }
    }

    
  </script>
</body>
</html>
